<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histoire interactive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6c5ce7;
            --bg-deep: #12132b;
            --bg-glow: #2c2f78;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.16);
            --text-light: #f6f4ff;
            --text-dim: rgba(246, 244, 255, 0.72);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            font-family: 'Poppins', system-ui, -apple-system, sans-serif;
            color: var(--text-light);
            background: var(--bg-deep);
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 55%),
                radial-gradient(circle at 85% 0%, var(--bg-glow), transparent 60%),
                radial-gradient(circle at 50% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%),
                var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .app-container { width: 100%; max-width: 480px; }

        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            padding: 32px 28px;
            overflow: hidden;
        }

        [hidden] { display: none !important; }

        .eyebrow {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: block;
            margin-bottom: 10px;
        }

        h1, h2 {
            font-family: 'Fredoka', 'Poppins', system-ui, sans-serif;
            margin: 0 0 8px;
        }

        h1 { font-size: 28px; line-height: 1.2; }
        h2 { font-size: 20px; }

        p { margin: 0 0 16px; color: var(--text-dim); line-height: 1.6; }

        .pill-button {
            appearance: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 15px;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ff7ac6));
            padding: 14px 24px;
            border-radius: 999px;
            box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 45%, transparent);
            transition: transform 0.18s ease, filter 0.18s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .pill-button:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.08); }
        .pill-button:active { transform: translateY(0) scale(0.98); }
        .pill-button.ghost {
            background: transparent;
            box-shadow: none;
            color: var(--text-light);
            border: 1px solid var(--card-border);
        }
        .pill-button.small { padding: 10px 18px; font-size: 14px; }
        .pill-button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

        /* ---- Cover screen ---- */
        #cover { text-align: center; }
        .cover-art {
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #1a1c3d), #1a1c3d);
            box-shadow: inset 0 0 0 1px var(--card-border);
        }
        .cover-art img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md); }
        #cover .actions { margin-top: 20px; }

        /* ---- Reader screen ---- */
        .page-art {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: var(--radius-md);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 40%, #1a1c3d), #14162f);
            box-shadow: inset 0 0 0 1px var(--card-border);
        }
        .page-art img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-md); }

        .page-text {
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-light);
        }
        .word {
            cursor: pointer;
            border-radius: 6px;
            padding: 0 2px;
            transition: color 0.15s ease, background 0.15s ease;
        }
        .word:hover { background: rgba(255, 255, 255, 0.08); }
        .word.active {
            color: #ffd76e;
            background: color-mix(in srgb, #ffd76e 18%, transparent);
        }

        .dots { display: flex; gap: 6px; justify-content: center; margin: 18px 0; }
        .dots i {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--card-border);
            transition: all 0.2s ease;
        }
        .dots i.on { background: var(--accent); width: 20px; border-radius: 5px; }

        .reader-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }
        .round-button {
            appearance: none;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-light);
            width: 44px; height: 44px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .round-button:hover { background: rgba(255, 255, 255, 0.14); transform: scale(1.06); }
        .round-button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .round-button.active { background: var(--accent); border-color: transparent; }

        /* ---- Quiz screen ---- */
        .quiz-option {
            display: block;
            width: 100%;
            text-align: left;
            appearance: none;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-light);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 10px;
            font-family: inherit;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        .quiz-option:hover { background: rgba(255, 255, 255, 0.1); }
        .quiz-option.correct { border-color: #6fe3a0; background: color-mix(in srgb, #6fe3a0 20%, transparent); }
        .quiz-option.wrong { border-color: #ff7a90; background: color-mix(in srgb, #ff7a90 20%, transparent); }

        .status-line { font-size: 13px; color: var(--text-dim); margin-top: 14px; text-align: center; }

        @media (max-width: 420px) {
            .card { padding: 24px 18px; border-radius: var(--radius-md); }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <!-- 1. INPUTS CACHÉS (Interface avec Celestory) -->
    <input type="hidden" id="input_storyTitle" value="{{storyTitle}}">
    <input type="hidden" id="input_childName" value="{{childName}}">
    <input type="hidden" id="input_themeColor" value="{{themeColor}}">
    <input type="hidden" id="input_language" value="{{language}}">
    <input type="hidden" id="input_coverImageUrl" value="{{coverImageUrl}}">
    <input type="hidden" id="input_pagesJson" value="{{pagesJson}}">
    <input type="hidden" id="input_quizJson" value="{{quizJson}}">

    <!-- 2. UI VISIBLE -->
    <div class="app-container">
        <section class="card" id="cover">
            <span class="eyebrow">Un livre qui se lit à voix haute</span>
            <div class="cover-art" id="cover-art"><span>📖</span></div>
            <h1 id="cover-title">Histoire interactive</h1>
            <p id="cover-greeting">Touche les mots pour les entendre, et laisse l'histoire se lire toute seule.</p>
            <div class="actions">
                <button class="pill-button" id="btn-open">
                    <span>✨</span><span>Ouvrir le livre</span>
                </button>
            </div>
        </section>

        <section class="card" id="reader" hidden>
            <div class="page-art" id="page-art"><span>🌙</span></div>
            <div class="dots" id="dots"></div>
            <p class="page-text" id="page-text"></p>
            <div class="reader-bar">
                <button class="round-button" id="btn-prev" aria-label="Page précédente">‹</button>
                <button class="round-button" id="btn-sound" aria-label="Lire à voix haute">🔊</button>
                <button class="pill-button small" id="btn-finish" hidden>Terminer</button>
                <button class="round-button" id="btn-next" aria-label="Page suivante">›</button>
            </div>
        </section>

        <section class="card" id="quiz" hidden>
            <span class="eyebrow" id="quiz-eyebrow">Petit quiz</span>
            <h2 id="quiz-question"></h2>
            <div id="quiz-options"></div>
            <p class="status-line" id="quiz-status"></p>
        </section>

        <section class="card" id="finale" hidden style="text-align:center;">
            <div class="cover-art"><span>🌟</span></div>
            <h1>Bravo !</h1>
            <p id="finale-text">Tu as lu toute l'histoire.</p>
            <div class="actions">
                <button class="pill-button" id="btn-restart"><span>🔁</span><span>Relire l'histoire</span></button>
            </div>
        </section>
    </div>

    <!-- 3. LOGIQUE JS -->
    <script>
        (function () {
            const val = (id) => document.getElementById(id).value;
            const raw = {
                storyTitle: val('input_storyTitle'),
                childName: val('input_childName'),
                themeColor: val('input_themeColor'),
                language: val('input_language'),
                coverImageUrl: val('input_coverImageUrl'),
                pagesJson: val('input_pagesJson'),
                quizJson: val('input_quizJson'),
            };

            const isTemplateLeftover = (s) => !s || /^\{\{.*\}\}$/.test(s.trim());
            const safeJson = (s, fallback) => {
                if (isTemplateLeftover(s)) return fallback;
                try {
                    const parsed = JSON.parse(s);
                    return Array.isArray(parsed) && parsed.length ? parsed : fallback;
                } catch (e) { return fallback; }
            };

            const defaultPages = [
                { text: "Il était une fois un petit nuage qui avait peur du noir.", emoji: "☁️" },
                { text: "Chaque soir, il cherchait une étoile pour se faire un ami.", emoji: "✨" },
                { text: "Une nuit, une petite étoile lui tendit la main, et le ciel ne fut plus jamais sombre.", emoji: "🌙" },
            ];

            const title = isTemplateLeftover(raw.storyTitle) ? "Histoire interactive" : raw.storyTitle;
            const childName = isTemplateLeftover(raw.childName) ? "" : raw.childName;
            const themeColor = isTemplateLeftover(raw.themeColor) ? "" : raw.themeColor;
            const language = isTemplateLeftover(raw.language) ? "fr-FR" : raw.language;
            const coverImageUrl = isTemplateLeftover(raw.coverImageUrl) ? "" : raw.coverImageUrl;
            const pages = safeJson(raw.pagesJson, defaultPages);
            const quiz = safeJson(raw.quizJson, []);

            if (themeColor) {
                document.documentElement.style.setProperty('--accent', themeColor);
            }
            document.title = title;
            document.getElementById('cover-title').textContent = title;
            if (childName) {
                document.getElementById('cover-greeting').textContent =
                    `${childName}, touche les mots pour les entendre, et laisse l'histoire se lire toute seule.`;
            }
            if (coverImageUrl) {
                document.getElementById('cover-art').innerHTML = `<img src="${coverImageUrl}" alt="">`;
            }

            function sendToCelestory(key, value) {
                try {
                    if (window.parent && window.parent.document) {
                        window.parent.document.dispatchEvent(new CustomEvent('CelestoryOutput', { detail: { key, value } }));
                    }
                } catch (e) { /* embedding context may block cross-origin access; ignore */ }
            }

            const synth = window.speechSynthesis;
            let soundOn = true;
            let currentIndex = 0;

            const dotsEl = document.getElementById('dots');
            const pageArtEl = document.getElementById('page-art');
            const pageTextEl = document.getElementById('page-text');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const btnSound = document.getElementById('btn-sound');
            const btnFinish = document.getElementById('btn-finish');

            function tokenize(text) {
                const words = [];
                const re = /\S+/g;
                let m;
                while ((m = re.exec(text))) {
                    words.push({ text: m[0], start: m.index, end: m.index + m[0].length });
                }
                return words;
            }

            function escapeHtml(s) {
                return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            }

            function speak(text, onWord, onEnd) {
                if (!synth) { if (onEnd) onEnd(); return; }
                synth.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = language;
                utter.rate = 0.95;
                const words = tokenize(text);
                utter.onboundary = (e) => {
                    if (typeof e.charIndex !== 'number') return;
                    const w = words.find((w) => e.charIndex >= w.start && e.charIndex < w.end) ||
                        words.find((w) => e.charIndex <= w.start);
                    if (w && onWord) onWord(words.indexOf(w));
                };
                utter.onend = () => { if (onEnd) onEnd(); };
                synth.speak(utter);
            }

            function renderDots() {
                dotsEl.innerHTML = pages.map((_, i) => `<i class="${i === currentIndex ? 'on' : ''}"></i>`).join('');
            }

            function renderPage() {
                const page = pages[currentIndex];
                pageArtEl.innerHTML = page.imageUrl
                    ? `<img src="${page.imageUrl}" alt="">`
                    : `<span>${page.emoji || '📖'}</span>`;
                const words = tokenize(page.text || '');
                pageTextEl.innerHTML = words.map((w, i) =>
                    `<span class="word" data-i="${i}">${escapeHtml(w.text)}</span>`
                ).join(' ');
                renderDots();
                btnPrev.disabled = currentIndex === 0;
                const isLast = currentIndex === pages.length - 1;
                btnNext.hidden = isLast;
                btnFinish.hidden = !isLast;
                sendToCelestory('currentPage', currentIndex + 1);

                if (soundOn) {
                    speak(page.text || '', highlightWord, () => {});
                }
            }

            function highlightWord(index) {
                pageTextEl.querySelectorAll('.word').forEach((el) => el.classList.remove('active'));
                const el = pageTextEl.querySelector(`.word[data-i="${index}"]`);
                if (el) el.classList.add('active');
            }

            pageTextEl.addEventListener('click', (e) => {
                const target = e.target.closest('.word');
                if (!target) return;
                if (synth) {
                    synth.cancel();
                    const utter = new SpeechSynthesisUtterance(target.textContent);
                    utter.lang = language;
                    synth.speak(utter);
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentIndex > 0) { currentIndex--; renderPage(); }
            });
            btnNext.addEventListener('click', () => {
                if (currentIndex < pages.length - 1) { currentIndex++; renderPage(); }
            });
            btnSound.addEventListener('click', () => {
                soundOn = !soundOn;
                btnSound.classList.toggle('active', soundOn);
                if (!soundOn && synth) synth.cancel();
            });
            btnSound.classList.add('active');

            btnFinish.addEventListener('click', () => {
                if (synth) synth.cancel();
                document.getElementById('reader').hidden = true;
                if (quiz.length) {
                    startQuiz();
                } else {
                    finishStory(null);
                }
            });

            document.getElementById('btn-open').addEventListener('click', () => {
                document.getElementById('cover').hidden = true;
                document.getElementById('reader').hidden = false;
                currentIndex = 0;
                renderPage();
            });

            document.getElementById('btn-restart').addEventListener('click', () => {
                if (synth) synth.cancel();
                document.getElementById('finale').hidden = true;
                document.getElementById('cover').hidden = false;
                sendToCelestory('storyCompleted', false);
            });

            // ---- Quiz ----
            let quizIndex = 0;
            let quizScore = 0;
            const quizQuestionEl = document.getElementById('quiz-question');
            const quizOptionsEl = document.getElementById('quiz-options');
            const quizStatusEl = document.getElementById('quiz-status');

            function startQuiz() {
                quizIndex = 0;
                quizScore = 0;
                document.getElementById('quiz').hidden = false;
                renderQuizQuestion();
            }

            function renderQuizQuestion() {
                const q = quiz[quizIndex];
                quizQuestionEl.textContent = q.question || '';
                quizStatusEl.textContent = `Question ${quizIndex + 1} / ${quiz.length}`;
                quizOptionsEl.innerHTML = '';
                (q.options || []).forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'quiz-option';
                    btn.textContent = opt;
                    btn.addEventListener('click', () => answerQuiz(i, btn));
                    quizOptionsEl.appendChild(btn);
                });
            }

            function answerQuiz(choiceIndex, btnEl) {
                const q = quiz[quizIndex];
                const correct = choiceIndex === q.answer;
                if (correct) { quizScore++; btnEl.classList.add('correct'); }
                else { btnEl.classList.add('wrong'); }
                Array.from(quizOptionsEl.children).forEach((b) => (b.style.pointerEvents = 'none'));

                setTimeout(() => {
                    quizIndex++;
                    if (quizIndex < quiz.length) {
                        renderQuizQuestion();
                    } else {
                        document.getElementById('quiz').hidden = true;
                        sendToCelestory('quizScore', quizScore);
                        finishStory(`Tu as obtenu ${quizScore} / ${quiz.length} au quiz.`);
                    }
                }, 700);
            }

            function finishStory(quizSummary) {
                document.getElementById('finale-text').textContent = quizSummary || "Tu as lu toute l'histoire.";
                document.getElementById('finale').hidden = false;
                sendToCelestory('storyCompleted', true);
            }
        })();
    </script>
</body>
</html>
<!--
DOCUMENTATION CELESTORY
-----------------------
ENTRÉES (Variables à créer dans Celestory) :
- storyTitle (Type: Texte, Ex: "Le Petit Nuage Curieux")
- childName (Type: Texte, optionnel, Ex: "Emma") — personnalise le message d'accueil
- themeColor (Type: Texte/Couleur, optionnel, Ex: "#6C5CE7") — couleur d'accent de l'interface
- language (Type: Texte, optionnel, Ex: "fr-FR") — langue utilisée pour la lecture à voix haute
- coverImageUrl (Type: Texte/URL, optionnel) — image de couverture
- pagesJson (Type: Texte long/JSON, Ex: [{"text":"...", "imageUrl":"https://..."}, ...]) — pages de l'histoire
- quizJson (Type: Texte long/JSON, optionnel, Ex: [{"question":"...","options":["...","..."],"answer":0}, ...])

SORTIES (Variables récupérées par Celestory) :
- currentPage (Type: Nombre) — page actuellement affichée (1-indexée)
- storyCompleted (Type: Booléen) — vrai une fois la dernière page (et le quiz éventuel) terminés
- quizScore (Type: Nombre) — score obtenu au quiz, si un quiz est fourni

DÉCLARATION DES SORTIES POUR L'ÉDITEUR CELESTORY :
new CustomEvent('CelestoryOutput', { detail: { key: 'currentPage', value: 1 } });
new CustomEvent('CelestoryOutput', { detail: { key: 'storyCompleted', value: false } });
new CustomEvent('CelestoryOutput', { detail: { key: 'quizScore', value: 0 } });
-->
